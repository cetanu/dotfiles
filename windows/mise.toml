[env]
_.path = ["~/scoop/shims"]

[bootstrap.hooks.pre-packages]
description = "Install Scoop if needed"
run = """
powershell -NoProfile -ExecutionPolicy Bypass -Command "
  if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
    Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
  }
"
"""

# Machine packages are installed only by `mise bootstrap`.
[bootstrap.packages]
"scoop:git" = "latest"
"scoop:ffmpeg" = "latest"
"scoop:7zip" = "latest"
"scoop:jq" = "latest"
"scoop:fd" = "latest"
"scoop:ripgrep" = "latest"
"scoop:fzf" = "latest"
"scoop:tree-sitter" = "latest"
"scoop:llvm" = "latest"
"scoop:gopls" = "latest"
"scoop:lua-language-server" = "latest"
"scoop:rust-analyzer" = "latest"
"scoop:stylua" = "latest"
"scoop:neovim" = "latest"
"scoop:delta" = "latest"
"scoop:dua" = "latest"
"scoop:hyperfine" = "latest"
"scoop:oha" = "latest"
"scoop:docker" = "latest"
"scoop:docker-compose" = "latest"

[tools]
# Runtimes
node = "lts"
python = ["3.11", "3.12", "3.13", "3.14"]
rust = "stable"
uv = "latest"

# Python command-line tools
"pipx:pipx" = "latest"
"pipx:poetry" = { version = "latest", depends = "python" }
"pipx:ruff" = { version = "latest", depends = "python" }

# Node-based language servers and editor tools
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:awk-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:neovim" = "latest"

[tasks.bootstrap]
description = "Set up Nerd Font, PowerShell mise activation, and Python packages used by Neovim and Salt"
run = [
  """
  powershell -NoProfile -ExecutionPolicy Bypass -Command "
    if ((scoop bucket list | Select-Object -ExpandProperty Name) -notcontains 'nerd-fonts') {
      scoop bucket add nerd-fonts
    }
    if (-not (scoop export | Select-String -SimpleMatch 'Symbols-only-Nerd-Font' -Quiet)) {
      scoop install nerd-fonts/Symbols-only-Nerd-Font
    }
    if (-not (Test-Path $PROFILE)) {
      New-Item -ItemType File -Path $PROFILE -Force | Out-Null
    }
    $activation = '(&mise activate pwsh) | Out-String | Invoke-Expression'
    if (-not (Select-String -Path $PROFILE -SimpleMatch $activation -Quiet)) {
      Add-Content -Path $PROFILE -Value $activation
    }
  "
  """,
  "mise exec python@3.14 -- python -m pip install --user pynvim salt-lsp",
]

[dotfiles]
"~/AppData/Local/nvim/init.lua" = { source = "../nvim/init.lua", mode = "symlink" }
"~/AppData/Local/nvim/lua/vsy" = { source = "../nvim/vsy", mode = "symlink-each" }
"~/.gitconfig" = { source = "../gitconfig", mode = "symlink" }
"~/AGENTS.md" = { source = "../AGENTS.md", mode = "symlink" }
"~/.gemini/antigravity-cli/settings.json" = { source = "../antigravity.json", mode = "symlink" }
"~/.codex/rules/default.rules" = { source = "../codex.rules", mode = "symlink" }
